name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-unsigned-ipa:
    runs-on: macos-15

    env:
      JUDGE0_KEY: ${{ secrets.JUDGE0_KEY }}
      JUDGE0_ENDPOINT: ${{ secrets.JUDGE0_ENDPOINT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer

      - name: Download frameworks
        run: ./downloadFrameworks.sh

      - name: Generate secrets file for runtime config
        if: ${{ env.JUDGE0_KEY != '' && env.JUDGE0_ENDPOINT != '' }}
        run: |
          mkdir -p CodeApp/Constants
          printf '%s\n' "let JUDGE0_ENDPOINT = \"${JUDGE0_ENDPOINT}\"" > CodeApp/Constants/Secrets.swift
          printf '%s\n' "let JUDGE0_KEY = \"${JUDGE0_KEY}\"" >> CodeApp/Constants/Secrets.swift

      - name: Build unsigned iOS app
        run: |
          set -euo pipefail
          xcodebuild \
            -project Code.xcodeproj \
            -scheme "Code App" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          PRODUCTS_DIR="build/DerivedData/Build/Products/Release-iphoneos"
          APP_PATH="$(find "$PRODUCTS_DIR" -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "No .app product found in $PRODUCTS_DIR"
            ls -la "$PRODUCTS_DIR"
            exit 1
          fi

          mkdir -p build/unsigned-ipa/Payload
          ditto "$APP_PATH" "build/unsigned-ipa/Payload/$(basename "$APP_PATH")"
          find build/unsigned-ipa/Payload -type d -name _CodeSignature -prune -exec rm -rf {} +
          find build/unsigned-ipa/Payload -type f -name embedded.mobileprovision -delete
          cd build/unsigned-ipa
          /usr/bin/zip -qry ../../CodeApp-unsigned.ipa Payload

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeApp-unsigned-ipa
          path: CodeApp-unsigned.ipa
          if-no-files-found: error
